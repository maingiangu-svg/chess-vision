<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chess Vision AI</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><small>CHESS VISION AI</small><h1>Camera Analyzer</h1></div><span id="connection">Ngoại tuyến</span></header><section class="viewer"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas><div id="hint">Bật camera để bắt đầu</div></section><section class="status"><div><small>Nhận diện</small><strong id="recognition">Chưa bắt đầu</strong></div><div><small>Nước tốt nhất</small><strong id="move">—</strong></div><div><small>Đánh giá</small><strong id="score">—</strong></div><div><small>Đến lượt</small><strong id="turn">—</strong></div><div><small>Độ tin cậy</small><strong id="confidence">—</strong></div><div><small>Độ trễ</small><strong id="latency">—</strong></div></section><section class="controls"><button id="start" class="primary">Bật camera</button><button id="stop">Tắt camera</button><button id="switch">Đổi camera</button><button id="detect">Tìm bàn cờ</button><button id="calibrate">Chọn 4 góc</button><button id="orientation">Trắng ở dưới</button><button id="side">Thiết lập thế cờ</button><button id="analyze">Phân tích</button><button id="pause">Tạm dừng</button><button id="reset">Ván mới</button><button id="sample">Lưu ảnh mẫu</button><button id="templates">Lấy mẫu quân (ván mới)</button></section><p id="message">Chỉ dùng để luyện tập và nghiên cứu.</p></main><script src="/app.js?v=4"></script></body></html>
